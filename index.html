<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<!-- La pagina può comunicare solo con Dropbox: nessun altro server riceve dati -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.dropboxapi.com https://content.dropboxapi.com; media-src https://*.dropboxusercontent.com; img-src data: blob: https://*.dropboxusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Musica">
<meta name="theme-color" content="#000000">
<title>Musica</title>
<style>
:root{--bg:#000;--surf:#141416;--surf2:#1d1d20;--line:#26262a;--fg:#fff;--mut:#a1a1aa;--acc:#3ddc97;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.hidden{display:none!important}
#app{max-width:680px;margin:0 auto}
#view{padding:calc(var(--st) + 20px) 20px calc(170px + var(--sb))}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mut{color:var(--mut)}
.small{font-size:13px}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:22px}
.ibtn:active{background:var(--surf)}
.ibtn.on{color:var(--acc)}
.chips{display:flex;gap:8px;margin:16px 0 12px}
.chip{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:#fff;color:#000;border-color:#fff}
.item{display:flex;align-items:center;gap:14px;padding:8px 0;width:100%}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{position:relative;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-weight:800;user-select:none}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.round{border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.card .art{width:100%;aspect-ratio:1/1;border-radius:4px;font-size:44px}
.badge{display:inline-block;padding:2px 6px;border:1px solid var(--acc);border-radius:4px;color:var(--acc);font-size:11px;font-weight:700;white-space:nowrap}
.btns{display:flex;gap:12px;margin-top:18px}
.pill{flex:1;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}
.pill.primary{background:#fff;color:#000}
.pill.sec{border:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;margin-left:-10px;padding-right:10px;color:var(--fg);font-size:15px;font-weight:600}
.track{display:flex;align-items:center;gap:12px;min-height:52px;width:100%}
.track .n{width:26px;flex:none;font-size:14px;color:var(--mut);display:flex}
.track .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.track .tt span:first-child{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .d{font-size:13px;color:var(--mut);flex:none}
.track.now .tt span:first-child,.track.now .n{color:var(--acc)}
.disc{font-size:13px;font-weight:700;color:var(--mut);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.sec-h{font-size:19px;font-weight:700;margin:24px 0 8px}
.empty{padding:36px 0;color:var(--mut);line-height:1.5}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);z-index:10}
.bottom-in{max-width:680px;margin:0 auto}
.mini{display:flex;flex-direction:column;margin:0 8px 8px;border-radius:10px;overflow:hidden;background:var(--surf)}
.mini-main{display:flex;align-items:center;gap:8px;padding:8px}
.mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.prog{height:2px;background:var(--line)}
.prog>div{height:2px;background:var(--acc);width:0}
.tabs{display:flex;justify-content:space-around;padding:6px 12px calc(6px + var(--sb));border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600}
.tab.on{color:var(--fg)}
.player{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.player-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(var(--st) + 10px) 20px calc(18px + var(--sb))}
.phead{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center}
.cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.palb{font-size:13px;font-weight:600;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{width:100%;aspect-ratio:1/1;border-radius:6px;margin-top:20px;font-size:96px}
.ptitle{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partist{font-size:16px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
input[type=range].scrub{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:18px 0 0;background:transparent;--p:0%}
.scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--p),var(--line) var(--p))}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px}
.scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.scrub::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
.scrub::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctrls .ibtn{width:52px;height:52px;border-radius:26px}
.playbig{width:72px;height:72px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;flex:none}
.aux{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:22px}
.qbtn{height:36px;padding:0 14px;border-radius:18px;background:var(--surf);font-size:13px;font-weight:600}
.rep1{position:relative}
.rep1::after{content:"1";position:absolute;top:7px;right:5px;font-size:10px;font-weight:800;color:var(--acc)}
.queue{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:10px;background:var(--surf);color:var(--mut);margin-top:16px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font-size:16px}
.box{background:var(--surf);border-radius:12px;padding:16px;margin-top:14px}
.box h2{font-size:15px;margin:0 0 6px}
.box p{margin:6px 0;color:var(--mut);font-size:14px;line-height:1.5}
.btn{height:44px;padding:0 18px;border-radius:22px;background:#fff;color:#000;font-weight:700;font-size:15px}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.field{width:100%;height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;margin-top:8px}
code{font:13px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);padding:4px 6px;border-radius:6px}
details summary{cursor:pointer;font-weight:700;font-size:15px;padding:4px 0}
.log{font:12px/1.45 ui-monospace,Menlo,monospace;max-height:300px;overflow:auto;white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px;margin-top:8px;color:var(--mut)}
.err{background:#2a1214;color:#ffb4b4;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 12px);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
.qbtn.on{color:var(--acc)}
.auxmid{display:flex;gap:8px}
.eq{display:flex;flex-direction:column;gap:10px}
.eq p{margin:0}
.eqp{display:flex;flex-wrap:wrap;gap:8px}
.eqp .chip{height:32px;padding:0 12px;font-size:13px}
.eqb{display:grid;grid-template-columns:48px 1fr 54px;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.eqb input{width:100%;accent-color:var(--acc)}
.eqb span:last-child{text-align:right;color:var(--fg)}
.note{background:var(--surf2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mut);line-height:1.45}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>

<div id="bottom" class="bottom hidden">
  <div class="bottom-in">
    <div id="mini" class="mini hidden">
      <div class="mini-main">
        <button id="miniOpen" class="open" aria-label="Apri il lettore">
          <div id="miniArt" class="art" style="width:44px;height:44px;border-radius:4px;font-size:18px"></div>
          <div class="txt"><span id="miniTitle" class="t1" style="font-size:14px"></span><span id="miniSub" class="t2" style="font-size:12px"></span></div>
        </button>
        <button id="miniPP" class="ibtn" aria-label="Riproduci"></button>
      </div>
      <div class="prog"><div id="miniProg"></div></div>
    </div>
    <nav class="tabs" aria-label="Sezioni">
      <button class="tab" data-tab="lib"></button>
      <button class="tab" data-tab="search"></button>
      <button class="tab" data-tab="settings"></button>
    </nav>
  </div>
</div>

<section id="player" class="player hidden" aria-label="In riproduzione">
  <div class="player-in">
    <div class="between">
      <button id="pClose" class="ibtn" aria-label="Chiudi il lettore"></button>
      <div class="phead"><span class="cap">In riproduzione</span><span id="pAlbum" class="palb"></span></div>
      <button id="pQueueIcon" class="ibtn" aria-label="Coda di riproduzione"></button>
    </div>
    <div id="pArt" class="art big"></div>
    <div class="between" style="margin-top:24px;align-items:flex-end">
      <div style="min-width:0;display:flex;flex-direction:column;gap:4px"><div id="pTitle" class="ptitle"></div><button id="pArtist" class="partist"></button></div>
      <span id="pBadge" class="badge hidden"></span>
    </div>
    <input id="pSeek" class="scrub" type="range" min="0" max="1000" value="0" aria-label="Posizione nel brano">
    <div class="between small mut"><span id="pCur">0:00</span><span id="pRem">−0:00</span></div>
    <div class="ctrls">
      <button id="pBack10" class="ibtn" aria-label="Indietro di 10 secondi"></button>
      <button id="pPrev" class="ibtn" aria-label="Brano precedente"></button>
      <button id="pPP" class="playbig" aria-label="Riproduci"></button>
      <button id="pNext" class="ibtn" aria-label="Brano successivo"></button>
      <button id="pFwd10" class="ibtn" aria-label="Avanti di 10 secondi"></button>
    </div>
    <div class="aux">
      <button id="pShuffle" class="ibtn" aria-label="Riproduzione casuale"></button>
      <div class="auxmid"><button id="pQueue" class="qbtn">Coda</button><button id="pEq" class="qbtn" aria-label="Equalizzatore">EQ</button></div>
      <button id="pRepeat" class="ibtn" aria-label="Ripeti"></button>
    </div>
    <div id="queueBox" class="queue hidden"></div>
    <div id="eqBox" class="queue hidden" data-eq-host></div>
  </div>
</section>

<div id="toast" class="toast hidden" role="status"></div>
<audio id="audio" preload="auto"></audio>

<script>
'use strict';
const VERSION = '1.5';
const AUTH_URL = 'https://www.dropbox.com/oauth2/authorize';
const TOKEN_URL = 'https://api.dropboxapi.com/oauth2/token';
const API = 'https://api.dropboxapi.com/2/';
const CONTENT = 'https://content.dropboxapi.com/2/';
const SCOPES = 'files.metadata.read files.content.read';
const REDIRECT_URI = location.origin + location.pathname;
const LINK_TTL = 2 * 3600 * 1000;   // i link Dropbox durano 4 ore: li rinnoviamo molto prima
const K = { appKey: 'mx_app_key', refresh: 'mx_refresh', verifier: 'mx_verifier', state: 'mx_state', log: 'mx_log',
            index: 'mx_index_v2', tags: 'mx_tags_v1', ameta: 'mx_ameta_v1', cues: 'mx_cues_v1', resume: 'mx_resume_v2', libTab: 'mx_libtab', eq: 'mx_eq_v1', autoResume: 'mx_autoresume' };
const PALETTE = ['#1D2B53', '#2B2D42', '#0F3D3E', '#7D2E68', '#4A3B5C', '#264653', '#3A3A40', '#5A3E2B', '#30475E', '#4E3B31'];

/* ---------------- riconoscimento della libreria (funzioni pure) ---------------- */
const AUDIO_EXT = ['flac', 'mp3', 'm4a', 'aac', 'wav', 'aif', 'aiff', 'alac', 'ogg', 'opus', 'caf'];
const IMG_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
const INDEX_EXT = [...AUDIO_EXT, ...IMG_EXT, 'cue'];
function ext(n) { const i = n.lastIndexOf('.'); return i < 0 ? '' : n.slice(i + 1).toLowerCase(); }
function baseName(n) { const i = n.lastIndexOf('.'); return i < 0 ? n : n.slice(0, i); }
const natural = (a, b) => a.localeCompare(b, 'it', { numeric: true, sensitivity: 'base' });
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const SEP = /\s+[-–—]\s+/;
const DISC_RE = /^(cd|disc|disk|disco|dvd)\s*[-_.]?\s*\d+\b/i;
const JUNK_GROUP = /\b(flac|flaac|alac|wav|sacd(-r)?|shm|iso|hi-?res|pmedia|pbthal|lp|\d*cd\d*|records?|edition|remaster(ed)?|mmr|afz|epic|monkeywrench|japan(ese)?|vinyl|web|mp3|aac|dsd|mqa)\b|\b\d{2}\s?[-_/]\s?\d{2,3}(\.\d)?\b|\d{2}\s?bit|\bkhz\b/i;
const TAIL = /\s+(flac|flaac|alac|cd|lp|soup|atm|88|remaster(ed)?|\d{2}[-_]\d{2,3}|(16|24)\s?bit|japan(ese)?\s+ed(ition)?)$/i;

function titleCaseIfShouting(s) {
  if (!s || /[a-zà-ÿ]/.test(s) || !/\s/.test(s.trim())) return s;
  return s.toLowerCase().replace(/(^|[\s(\[\-/&])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
}
function cleanArtist(a) { return (a || '').replace(/\s+(feat\.?|ft\.?|featuring)\s.+$/i, '').trim(); }
function stripGroups(s, years) {
  return s.replace(/[\(\[\{]([^\)\]\}]*)[\)\]\}]/g, (all, g) => {
    const g2 = g.trim(); let m;
    if ((m = g2.match(/^((?:19|20)\d{2})(?:\s*[-–]\s*(?:19|20)?\d{2,4})?(?:\s+(?!remaster|remix|mix|edition|reissue|deluxe|version)[A-Za-zÀ-ÿ]+)?$/i))) { years.push([m[1], 1]); return ' '; }
    if (JUNK_GROUP.test(g2)) { const y = g2.match(/\b((?:19|20)\d{2})\b/); if (y) years.push([y[1], 4]); return ' '; }
    return all;
  });
}
function stripTail(s, years) {
  for (let i = 0; i < 8; i++) {
    const before = s;
    s = s.replace(TAIL, '').trim();
    if (!years.some(y => y[1] < 3)) { const m = s.match(/^(.+\S)\s+((?:19|20)\d{2})$/); if (m && !/[-–]$/.test(m[1])) { years.push([m[2], 3]); s = m[1].trim(); } }
    if (s === before) break;
  }
  return s;
}
function cleanTitle(t) {
  const years = [];
  let s = stripGroups((t || '').replace(/[⬀-⯿️]|[\u{1F000}-\u{1FAFF}]/gu, ' '), years).replace(/\s+/g, ' ').trim();
  s = s.replace(TAIL, '').trim();
  return s;
}
function parseAlbumFolder(name) {
  const years = [];
  let s = name.replace(/[⬀-⯿️]|[\u{1F000}-\u{1FAFF}]/gu, ' ');
  s = stripGroups(s, years).replace(/\s+/g, ' ').trim();
  s = stripTail(s, years);
  let m = s.match(/^((?:19|20)\d{2})\s*[.\-–)]\s*(.+)$/);
  if (m) { years.push([m[1], 2]); s = m[2].trim(); }
  const hadSep = SEP.test(s) || /\s[-–]$/.test(s);
  s = s.replace(/\s*[-–]\s*$/, '').trim();
  const parts = s.split(SEP).map(x => x.trim()).filter(Boolean);
  const isYear = x => /^(19|20)\d{2}$/.test(x);
  let artist = '', title = '';
  if (parts.length >= 3 && isYear(parts[1])) { artist = parts[0]; years.push([parts[1], 2]); title = parts.slice(2).join(' - '); }
  else if (parts.length >= 3 && isYear(parts[parts.length - 1]) && !/(19|20)\d{2}$/.test(parts[parts.length - 2])) { artist = parts[0]; years.push([parts[parts.length - 1], 2]); title = parts.slice(1, -1).join(' - '); }
  else if (parts.length >= 2) { artist = parts[0]; title = parts.slice(1).join(' - '); }
  else if (parts.length === 1 && hadSep) { artist = parts[0]; title = ''; }
  else title = parts[0] || '';
  m = artist.match(/^(.+?)\s+((?:19|20)\d{2})$/);
  if (m) { artist = m[1]; years.push([m[2], 2]); }
  if (/^(self[- ]?titled|s\/t|omonimo)$/i.test(title)) title = '';
  years.sort((a, b) => a[1] - b[1]);
  return { artist: artist.trim(), title: title.trim(), year: years.length ? years[0][0] : '', guessed: !artist };
}
function parseTrackName(n, artist) {
  let b = baseName(n).replace(/_/g, ' ').replace(/\s+/g, ' ').trim(), num = null, label = null, m;
  if ((m = b.match(/^([A-Da-d])(\d{1,2})\s*[-.]\s*(.+)$/))) { label = m[1].toUpperCase() + m[2]; b = m[3]; }
  else if ((m = b.match(/^(?:\d{1,2}[-.](?=\d))?(\d{1,3})(?!\d)(?:\s*[-.)]\s*|\s+)(.+)$/))) { num = parseInt(m[1], 10); b = m[2]; }
  else if ((m = b.match(/^(.*?)\s*\((\d{1,3})\)\s+(.+)$/))) { num = parseInt(m[2], 10); b = m[3]; }
  if (artist) {
    const re = new RegExp('^' + escapeRe(artist).replace(/\s+/g, '[\\s_-]+') + '\\s*[-–]\\s*', 'i');
    b = b.replace(re, '');
  }
  b = b.replace(/\s+/g, ' ').replace(/^[\s\-–.]+/, '').replace(/[\s_]+$/, '').trim();
  return { num, label: label || (num != null ? String(num) : null), title: b || baseName(n) };
}
function coverScore(name, depthBelow) {
  const b = baseName(name).toLowerCase().replace(/[_\-.]+/g, ' ').trim();
  const front = /\bfront\b/.test(b);
  if (!front && /\b(back|rear|disc|cd|booklet|inside|inlay|tray|label|matrix|spine|obi|spek|jolly|roger|proof|header|side|sleeve|insert|logo|poster|sticker|spectr\w*|dr\d*)\b/.test(b)) return -1;
  let s = 10;
  if (/^(cover|folder|front|album|copertina)$/.test(b)) s = 100;
  else if (front) s = 80;
  else if (/cover/.test(b)) s = 70;
  return s - depthBelow * 5;
}
function albumLike(n) { return /\b(19|20)\d{2}\b/.test(n) || /\s[-–—]\s/.test(n) || /[\[\{(]/.test(n) || /\b(flac|cd|lp|sacd|hi-?res)\b/i.test(n); }

function buildLibCore(IDXFILES, AMETA, CUES) {
  const albums = new Map(), tracks = new Map(), audioByFolder = new Map(), artistFolderImg = new Map();
  const entries = Object.entries(IDXFILES).map(([lower, f]) => {
    const segs = f[0].split('/').slice(1), name = segs[segs.length - 1];
    return { lower, disp: f[0], size: f[1], rev: f[2], segs, name, ext: ext(name), folder: lower.slice(0, lower.lastIndexOf('/')) };
  });
  for (const e of entries) if (AUDIO_EXT.includes(e.ext)) { if (!audioByFolder.has(e.folder)) audioByFolder.set(e.folder, []); audioByFolder.get(e.folder).push(e); }
  const imageCue = new Map();
  for (const e of entries) if (e.ext === 'cue') {
