<script>try{var t=localStorage.getItem('mx_theme')||'dark';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';if(t!=='dark'){document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='sand'?'#f6f2ea':'#ffffff';}}catch(e){}</script>
<style>
:root{--bg:#000;--surf:#141416;--surf2:#1d1d20;--line:#26262a;--fg:#fff;--mut:#a1a1aa;--acc:#3ddc97;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
  --accbg:#3ddc97;--inv:#fff;--invfg:#000;--bar:rgba(0,0,0,.55);--barsolid:rgba(0,0,0,.92);--mini:rgba(255,255,255,.1);--barline:rgba(255,255,255,.08);
  --sheet:rgba(36,36,40,.8);--sheetsolid:rgba(36,36,40,.97);--scrim:rgba(0,0,0,.45);--errbg:#2a1214;--errfg:#ffb4b4;--swoff:#46454a;--warn:#f5c518;--ok:#67ce67;--star:#f5c518}
/* tema chiaro e tema sabbia: stesse variabili, colori diversi (il verde più scuro, leggibile sul chiaro) */
:root[data-theme=light]{--bg:#fff;--surf:#f2f2f7;--surf2:#e5e5ea;--line:#d1d1d6;--fg:#000;--mut:#6e6e73;--acc:#0a8f5b;--inv:#111;--invfg:#fff;--bar:rgba(249,249,251,.78);--barsolid:rgba(249,249,251,.96);
  --mini:rgba(0,0,0,.05);--barline:rgba(0,0,0,.1);--sheet:rgba(250,250,252,.88);--sheetsolid:rgba(250,250,252,.98);--scrim:rgba(0,0,0,.25);--errbg:#fdecec;--errfg:#a11d1d;--swoff:#e3e3e8;--warn:#946600;--ok:#1f8a3b;--star:#e0a400;color-scheme:light}
:root[data-theme=sand]{--bg:#f6f2ea;--surf:#ece6da;--surf2:#e2dacb;--line:#d6cdbb;--fg:#2b2620;--mut:#776b5c;--acc:#2e7d4f;--inv:#2b2620;--invfg:#f6f2ea;--bar:rgba(246,242,234,.8);--barsolid:rgba(246,242,234,.97);
  --mini:rgba(43,38,32,.06);--barline:rgba(43,38,32,.1);--sheet:rgba(248,245,239,.9);--sheetsolid:rgba(248,245,239,.98);--scrim:rgba(43,38,32,.25);--errbg:#f6e3dc;--errfg:#9b2c1a;--swoff:#ddd5c6;--warn:#8a6100;--ok:#2e7d4f;--star:#c98f00;color-scheme:light}
:root[data-theme=light] .ptint,:root[data-theme=sand] .ptint{opacity:.5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
/* niente ingrandimento col doppio tocco (barra in basso, elenchi, pulsanti); resta lo zoom con due dita */
*{touch-action:manipulation}
.viewer,.viewer *{touch-action:none}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:92px;height:92px}
#splash rect{transform-origin:50% 50%;transform-box:fill-box;animation:spw 1.1s ease-in-out infinite}
#splash rect:nth-child(2){animation-delay:.12s}#splash rect:nth-child(3){animation-delay:.24s}#splash rect:nth-child(4){animation-delay:.36s}#splash rect:nth-child(5){animation-delay:.48s}
@keyframes spw{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}
@media (prefers-reduced-motion:reduce){#splash rect{animation:none}}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.hidden{display:none!important}
#app{max-width:680px;margin:0 auto}
#view{padding:calc(var(--st) + 20px) 20px calc(170px + var(--sb))}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mut{color:var(--mut)}
.small{font-size:13px}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:22px}
.ibtn:active{background:var(--surf)}
.ibtn.on{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px}
.chip{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.item{display:flex;align-items:center;gap:14px;padding:8px 0;width:100%}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{position:relative;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-weight:800;user-select:none}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.round{border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.card .art{width:100%;aspect-ratio:1/1;border-radius:4px;font-size:44px}
.badge{display:inline-block;padding:2px 6px;border:1px solid var(--acc);border-radius:4px;color:var(--acc);font-size:11px;font-weight:700;white-space:nowrap}
.btns{display:flex;gap:12px;margin-top:18px}
.pill{flex:1;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}
.pill.primary{background:var(--inv);color:var(--invfg)}
.pill.sec{border:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;margin-left:-10px;padding-right:10px;color:var(--fg);font-size:15px;font-weight:600}
.track{display:flex;align-items:center;gap:12px;min-height:52px;width:100%}
.track .n{width:26px;flex:none;font-size:14px;color:var(--mut);display:flex}
.track .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.track .tt span:first-child{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .d{font-size:13px;color:var(--mut);flex:none}
.track .o{display:flex;flex:none;color:var(--acc)}.track .o:empty{display:none}
.track.na,.card.na{opacity:.38}
.offrow{margin-top:10px;padding:6px 0}.offrow .icobox.on{color:var(--acc)}
.offnote{display:flex;gap:10px;align-items:center}
.track.now .tt span:first-child,.track.now .n{color:var(--acc)}
.disc{font-size:13px;font-weight:700;color:var(--mut);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.sec-h{font-size:19px;font-weight:700;margin:24px 0 8px}
.empty{padding:36px 0;color:var(--mut);line-height:1.5}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);z-index:10}
.bottom-in{max-width:680px;margin:0 auto}
.mini{display:flex;flex-direction:column;margin:8px 8px 8px;border-radius:12px;overflow:hidden;background:var(--mini)}
.mini-main{display:flex;align-items:center;gap:8px;padding:8px}
.mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.prog{height:2px;background:var(--line)}
.prog>div{height:2px;background:var(--acc);width:0}
.tabs{display:flex;justify-content:space-around;padding:6px 12px calc(6px + var(--sb));border-top:1px solid var(--barline)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600}
.tab.on{color:var(--fg)}
.player{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ptint{position:absolute;left:0;right:0;top:0;height:85vh;background-color:var(--ptint,#000);-webkit-mask-image:linear-gradient(#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:linear-gradient(#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);transition:background-color .7s ease;pointer-events:none;z-index:0}
.player-in{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(var(--st) + 10px) 20px calc(18px + var(--sb))}
.phead{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center}
.cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.palb{font-size:13px;font-weight:600;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{width:100%;aspect-ratio:1/1;border-radius:6px;margin-top:20px;font-size:96px}
.ptitle{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partist{font-size:16px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
input[type=range].scrub{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:18px 0 0;background:transparent;--p:0%}
.scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--inv) var(--p),var(--line) var(--p))}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--inv);margin-top:-5px}
.scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.scrub::-moz-range-progress{height:4px;border-radius:2px;background:var(--inv)}
.scrub::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--inv)}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctrls .ibtn{width:52px;height:52px;border-radius:26px}
.playbig{width:72px;height:72px;border-radius:50%;background:var(--inv);color:var(--invfg);display:flex;align-items:center;justify-content:center;flex:none}
.aux{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:22px}
.qbtn{height:36px;padding:0 14px;border-radius:18px;background:var(--surf);font-size:13px;font-weight:600}
.rep1{position:relative}
.rep1::after{content:"1";position:absolute;top:7px;right:5px;font-size:10px;font-weight:800;color:var(--acc)}
.queue{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:10px;background:var(--surf);color:var(--mut);margin-top:16px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font-size:16px}
.box{background:var(--surf);border-radius:12px;padding:16px;margin-top:14px}
.box h2{font-size:15px;margin:0 0 6px}
.box p{margin:6px 0;color:var(--mut);font-size:14px;line-height:1.5}
.sk .skp{color:var(--fg);font-size:15px;line-height:1.6;margin:8px 0}
.sk h3{font-size:17px;margin:18px 0 4px}.sk h4{font-size:15px;margin:14px 0 2px;color:var(--mut)}
.sk .skph{display:block;width:100%;max-height:320px;object-fit:cover;object-position:50% 25%;border-radius:8px;margin-bottom:12px}
.sk .sked{width:100%;min-height:45vh;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:15px;line-height:1.5}
.sk .sked1{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:15px}
.btn{height:44px;padding:0 18px;border-radius:22px;background:var(--inv);color:var(--invfg);font-weight:700;font-size:15px}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.field{width:100%;height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;margin-top:8px}
code{font:13px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);padding:4px 6px;border-radius:6px}
details summary{cursor:pointer;font-weight:700;font-size:15px;padding:4px 0}
.log{font:12px/1.45 ui-monospace,Menlo,monospace;max-height:300px;overflow:auto;white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px;margin-top:8px;color:var(--mut)}
.err{background:var(--errbg);color:var(--errfg);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 12px);background:var(--inv);color:var(--invfg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:50;max-width:90vw;text-align:center}
.qbtn.on{color:var(--acc)}
.auxmid{display:flex;gap:8px}
.pout{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;height:34px;padding:0 14px;border-radius:17px;background:var(--surf);font-size:13px;font-weight:600;color:var(--mut);max-width:100%}
.pout.on{color:var(--acc)}.pout svg{flex:none}.pout span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-h{padding:10px 14px 2px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.eq{display:flex;flex-direction:column;gap:10px}
.eq p{margin:0}
.eqp{display:flex;flex-wrap:wrap;gap:8px}
.eqp .chip{height:32px;padding:0 12px;font-size:13px}
.eqb{display:grid;grid-template-columns:48px 1fr 54px;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.eqb input{width:100%;accent-color:var(--acc)}
.eqb span:last-child{text-align:right;color:var(--fg)}
.trow{display:flex;align-items:center}
.trow .track{flex:1;min-width:0}
.more{width:40px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);flex:none;margin-right:-8px}
.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--sheet);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border-radius:16px 16px 0 0;padding:8px 8px calc(12px + var(--sb));max-height:80vh;overflow-y:auto}
.sheet-t{font-size:14px;font-weight:700;padding:12px 12px 8px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa{display:flex;align-items:center;gap:14px;width:100%;min-height:50px;padding:0 12px;font-size:16px;text-align:left;border-radius:10px}
.sa:active{background:var(--surf)}
.sa .si{display:flex;color:var(--mut)}
.sheet input{width:100%;height:46px;border-radius:10px;background:var(--surf);border:1px solid var(--line);color:var(--fg);padding:0 12px;font-size:16px}
.hrow{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hrow::-webkit-scrollbar{display:none}
.hrow .card{width:136px;flex:none}
.mixcard{background:var(--surf);border-radius:12px;padding:14px;margin-top:16px;display:flex;flex-direction:column;gap:14px}
.mixart{display:grid;grid-template-columns:1fr 1fr;width:64px;height:64px;border-radius:6px;overflow:hidden;flex:none}
.mixart.one{grid-template-columns:1fr}
.mixart .art{width:100%;height:100%;border-radius:0;font-size:14px}
.icobox{width:48px;height:48px;border-radius:6px;background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--acc);flex:none}
.ibtn.on[data-fav]{color:var(--acc)}
a.item{color:inherit;text-decoration:none}
.qrow{display:flex;align-items:center;gap:2px;position:relative;background:var(--bg);border-radius:8px}
.qrow .track{flex:1;min-width:0}
.grip{width:34px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--mut);touch-action:none;flex:none;margin-left:-8px}
.qrow.drag{z-index:3;background:var(--surf)}
.qrow.dropabove{box-shadow:inset 0 2px 0 var(--acc)}
.qrow.dropbelow{box-shadow:inset 0 -2px 0 var(--acc)}
.libbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.libbar .qbtn{display:inline-flex;align-items:center;gap:6px}
.qbtn.on{color:var(--acc)}
.updbar{position:fixed;left:12px;right:12px;top:calc(var(--st) + 8px);z-index:45;max-width:616px;margin:0 auto;background:var(--accbg);color:#04120b;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.updbar .go{background:#04120b;color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;flex:none}
.updbar .x{display:flex;flex:none;padding:6px;color:#04120b}
.note{background:var(--surf2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mut);line-height:1.45}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* barre semitrasparenti: senza sfocatura (browser vecchi) restano quasi opache, per leggibilità */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bottom{background:var(--barsolid)}.sheet{background:var(--sheetsolid)}}
.applogo{width:40px;height:40px;display:flex;flex:none}
.applogo svg{width:100%;height:100%}
/* pagina dell'artista */
.acard{width:104px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.acard .t1{font-size:13px;font-weight:600;max-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .t2{font-size:11px;color:var(--mut);max-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.lk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surf);min-width:0;color:inherit;text-decoration:none}
.lk .txt{display:flex;flex-direction:column;min-width:0}
.lk .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk .t2{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* scelta del tema */
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tsw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut)}
.tsw.on{color:var(--fg)}
.tprev{position:relative;width:100%;aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);overflow:hidden;display:block}
.tprev i{position:absolute;left:12%;right:12%;top:14%;height:30%;border-radius:4px}
.tprev b{position:absolute;left:12%;width:40%;bottom:16%;height:9%;border-radius:4px}
.tsw.on .tprev{outline:2px solid var(--acc);outline-offset:2px}
/* remix */
.rxsec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:10px}
.rxfx{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rxfx p{margin:0}
.rxbody{display:flex;flex-direction:column;gap:8px}
.rxgrid{display:grid;grid-template-columns:64px repeat(16,minmax(0,1fr));gap:2px;align-items:center;margin-top:4px}
.rxl{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.rxc{aspect-ratio:1/1;border-radius:3px;background:var(--surf2);min-width:0}
.rxc.b{background:var(--line)}
.rxc.on{background:var(--acc)}
.rxc.cur{outline:2px solid var(--fg);outline-offset:-2px}
#rxBox .eqb{grid-template-columns:84px 1fr 54px}
/* interruttori come quelli di iOS */
.sw{position:relative;width:64px;height:28px;border-radius:14px;background:var(--swoff);flex:none;transition:background-color .25s ease}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:38px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28),0 0 1px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,.7,.4,1.1)}
.sw[aria-checked=true]{background:#67ce67}
.sw[aria-checked=true]::after{transform:translateX(22px)}
.sw:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.srow{display:flex;flex-direction:column;gap:8px}
.srow+.srow{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.srow p{margin:0}
.eq>h2{font-size:15px}
/* stelle */
.stars{display:flex;align-items:center;gap:2px}
.star{display:flex;align-items:center;justify-content:center;width:34px;height:34px;color:var(--mut)}
.star.on{color:var(--star)}
.stars.lg .star{width:44px;height:44px}
/* booklet e visore */
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.bgrid .bt{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.bgrid .art{width:100%;aspect-ratio:1/1;border-radius:4px;font-size:22px}
.bgrid .bn{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdfic{width:100%;aspect-ratio:1/1;border-radius:4px;background:var(--surf2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--acc);font-size:12px;font-weight:700}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.vtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(var(--st) + 6px) 8px 6px;position:relative;z-index:2;background:linear-gradient(rgba(0,0,0,.75),transparent)}
.vtop .cnt{font-size:14px;font-weight:600;color:var(--mut)}
.vstage{flex:1;position:relative;overflow:hidden}
.vstage img{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform-origin:center center;will-change:transform}
.vcap{padding:8px 16px calc(10px + var(--sb));font-size:13px;color:var(--mut);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vnav{position:absolute;top:50%;margin-top:-24px;z-index:2;width:48px;height:48px;border-radius:24px;background:rgba(20,20,22,.7);display:none;align-items:center;justify-content:center}
@media (hover:hover) and (pointer:fine){.vnav{display:flex}}
.vload{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
/* statistiche e controllo libreria */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surf);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:24px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}
.bars .bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars .bar i{display:block;width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:1px}
.bars .bar.zero i{background:var(--line)}
.barlab{display:flex;gap:3px;margin-top:4px}
.barlab span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden}
.rank{display:flex;align-items:center;gap:12px;padding:6px 0;width:100%;text-align:left}
.rank .no{width:20px;flex:none;font-size:13px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.rank .meter{height:3px;border-radius:2px;background:var(--acc);margin-top:5px;opacity:.85}
.rank .cnt{font-size:13px;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.hc{background:var(--surf);border-radius:12px;margin-top:10px;overflow:hidden}
.hc>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.hc>summary::-webkit-details-marker{display:none}
.hc .st{width:26px;height:26px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.hc .st.ok{background:rgba(103,206,103,.16);color:var(--ok)}
.hc .st.warn{background:rgba(245,197,24,.18);color:var(--warn)}
.hc .st.info{background:var(--surf2);color:var(--mut)}
.hc .hb{padding:0 14px 12px}
.hc .hb .item{padding:6px 0}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--acc);width:0;transition:width .3s}
</style>
</head>

<script>
'use strict';
const VERSION = '1.59';
const AUTH_URL = 'https://www.dropbox.com/oauth2/authorize';
const TOKEN_URL = 'https://api.dropboxapi.com/oauth2/token';
const API = 'https://api.dropboxapi.com/2/';
const CONTENT = 'https://content.dropboxapi.com/2/';
const SCOPES = 'files.metadata.read files.content.read';
const WRITE_SCOPE = 'files.content.write';      // solo per /_player/dati.json (preferiti e playlist), /_player/schede/ (bio e dischi), /_batteria/ e /Remix/ (Remix)
const REDIRECT_URI = location.origin + location.pathname;
const LINK_TTL = 2 * 3600 * 1000;   // i link Dropbox durano 4 ore: li rinnoviamo molto prima
const K = { updSkip: 'mx_upd_skip', user: 'mx_user_v1', userDirty: 'mx_user_dirty', scopes: 'mx_scopes', wantWrite: 'mx_want_write', reqScope: 'mx_req_scope', appKey: 'mx_app_key', refresh: 'mx_refresh', verifier: 'mx_verifier', state: 'mx_state', log: 'mx_log',
            index: 'mx_index_v3', tags: 'mx_tags_v1', ameta: 'mx_ameta_v2', libView: 'mx_libview', cues: 'mx_cues_v1', resume: 'mx_resume_v2', libTab: 'mx_libtab', eq: 'mx_eq_v1', autoResume: 'mx_autoresume', lockWake: 'mx_lockwake', preload: 'mx_preload',
            rg: 'mx_rg_v1', hp: 'mx_hp_v1', gap: 'mx_gap', gapBg: 'mx_gap_bg', gapLead: 'mx_gap_lead', statsP: 'mx_stats_p', pseek: 'mx_pseek',
            mb: 'mx_mb_v1', mbKind: 'mx_mb_kind', cont: 'mx_cont', sk: 'mx_sk', theme: 'mx_theme', rhythm: 'mx_rhythm_v1', rxLag: 'mx_rx_lag', rxDrums: 'mx_rx_drums', off: 'mx_off_v1', offN: 'mx_off_n' };
const PALETTE = ['#1D2B53', '#2B2D42', '#0F3D3E', '#7D2E68', '#4A3B5C', '#264653', '#3A3A40', '#5A3E2B', '#30475E', '#4E3B31'];

/* ---------------- riconoscimento della libreria (funzioni pure) ---------------- */
const AUDIO_EXT = ['flac', 'mp3', 'm4a', 'aac', 'wav', 'aif', 'aiff', 'alac', 'ogg', 'opus', 'caf'];
const IMG_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
const SCAN_EXT = ['pdf', 'tif', 'tiff', 'bmp'];          // booklet e scansioni (oltre alle immagini normali)
const INDEX_EXT = [...AUDIO_EXT, ...IMG_EXT, ...SCAN_EXT, 'cue'];
const IDXV = 2;                                          // v2: l'indice comprende anche pdf e tif (booklet)
function ext(n) { const i = n.lastIndexOf('.'); return i < 0 ? '' : n.slice(i + 1).toLowerCase(); }
function baseName(n) { const i = n.lastIndexOf('.'); return i < 0 ? n : n.slice(0, i); }
const natural = (a, b) => a.localeCompare(b, 'it', { numeric: true, sensitivity: 'base' });
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const SEP = /\s+[-–—]\s+/;
const DISC_RE = /^(cd|disc|disk|disco|dvd)\s*[-_.]?\s*\d+\b/i;
const JUNK_GROUP = /\b(flac|flaac|alac|wav|sacd(-r)?|shm|iso|hi-?res|pmedia|pbthal|lp|\d*cd\d*|records?|edition|remaster(ed)?|mmr|afz|epic|monkeywrench|japan(ese)?|vinyl|web|mp3|aac|dsd|mqa)\b|\b\d{2}\s?[-_/]\s?\d{2,3}(\.\d)?\b|\d{2}\s?bit|\bkhz\b/i;
const TAIL = /\s+(flac|flaac|alac|cd|lp|soup|atm|88|remaster(ed)?|\d{2}[-_]\d{2,3}|(16|24)\s?bit|japan(ese)?\s+ed(ition)?)$/i;

function titleCaseIfShouting(s) {
  if (!s || /[a-zà-ÿ]/.test(s) || !/\s/.test(s.trim())) return s;
  return s.toLowerCase().replace(/(^|[\s(\[\-/&])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
}
function cleanArtist(a) { return (a || '').replace(/\s+(feat\.?|ft\.?|featuring)\s.+$/i, '').trim(); }
function stripGroups(s, years) {
  return s.replace(/[\(\[\{]([^\)\]\}]*)[\)\]\}]/g, (all, g) => {
    const g2 = g.trim(); let m;
    if ((m = g2.match(/^((?:19|20)\d{2})(?:\s*[-–]\s*(?:19|20)?\d{2,4})?(?:\s+(?!remaster|remix|mix|edition|reissue|deluxe|version)[A-Za-zÀ-ÿ]+)?$/i))) { years.push([m[1], 1]); return ' '; }
    if (JUNK_GROUP.test(g2)) { const y = g2.match(/\b((?:19|20)\d{2})\b/); if (y) years.push([y[1], 4]); return ' '; }
    return all;
  });
}
function stripTail(s, years) {
  for (let i = 0; i < 8; i++) {
    const before = s;
    s = s.replace(TAIL, '').trim();
    if (!years.some(y => y[1] < 3)) { const m = s.match(/^(.+\S)\s+((?:19|20)\d{2})$/); if (m && !/[-–]$/.test(m[1])) { years.push([m[2], 3]); s = m[1].trim(); } }
    if (s === before) break;
  }
  return s;
}
function cleanTitle(t) {
  const years = [];
  let s = stripGroups((t || '').replace(/[⬀-⯿️]|[\u{1F000}-\u{1FAFF}]/gu, ' '), years).replace(/\s+/g, ' ').trim();
  s = s.replace(TAIL, '').trim();
  return s;
}
function parseAlbumFolder(name) {
  const years = [];
  let s = name.replace(/[⬀-⯿️]|[\u{1F000}-\u{1FAFF}]/gu, ' ');
  s = stripGroups(s, years).replace(/\s+/g, ' ').trim();
  s = stripTail(s, years);
  let m = s.match(/^((?:19|20)\d{2})\s*[.\-–)]\s*(.+)$/);
  if (m) { years.push([m[1], 2]); s = m[2].trim(); }
  const hadSep = SEP.test(s) || /\s[-–]$/.test(s);
  s = s.replace(/\s*[-–]\s*$/, '').trim();
  const parts = s.split(SEP).map(x => x.trim()).filter(Boolean);
  const isYear = x => /^(19|20)\d{2}$/.test(x);
  let artist = '', title = '';
  if (parts.length >= 3 && isYear(parts[1])) { artist = parts[0]; years.push([parts[1], 2]); title = parts.slice(2).join(' - '); }
  else if (parts.length >= 3 && isYear(parts[parts.length - 1]) && !/(19|20)\d{2}$/.test(parts[parts.length - 2])) { artist = parts[0]; years.push([parts[parts.length - 1], 2]); title = parts.slice(1, -1).join(' - '); }
  else if (parts.length >= 2) { artist = parts[0]; title = parts.slice(1).join(' - '); }
  else if (parts.length === 1 && hadSep) { artist = parts[0]; title = ''; }
  else title = parts[0] || '';
  m = artist.match(/^(.+?)\s+((?:19|20)\d{2})$/);
  if (m) { artist = m[1]; years.push([m[2], 2]); }
  if (/^(self[- ]?titled|s\/t|omonimo)$/i.test(title)) title = '';
  years.sort((a, b) => a[1] - b[1]);
  return { artist: artist.trim(), title: title.trim(), year: years.length ? years[0][0] : '', guessed: !artist };
}
function parseTrackName(n, artist) {
  let b = baseName(n).replace(/_/g, ' ').replace(/\s+/g, ' ').trim(), num = null, label = null, m;
  if ((m = b.match(/^([A-Da-d])(\d{1,2})\s*[-.]\s*(.+)$/))) { label = m[1].toUpperCase() + m[2]; b = m[3]; }
  else if ((m = b.match(/^(?:\d{1,2}[-.](?=\d))?(\d{1,3})(?!\d)(?:\s*[-.)]\s*|\s+)(.+)$/))) { num = parseInt(m[1], 10); b = m[2]; }
  else if ((m = b.match(/^(.*?)\s*\((\d{1,3})\)\s+(.+)$/))) { num = parseInt(m[2], 10); b = m[3]; }
  if (artist) {
    const re = new RegExp('^' + escapeRe(artist).replace(/\s+/g, '[\\s_-]+') + '\\s*[-–]\\s*', 'i');
    b = b.replace(re, '');
  }
  b = b.replace(/\s+/g, ' ').replace(/^[\s\-–.]+/, '').replace(/[\s_]+$/, '').trim();
  return { num, label: label || (num != null ? String(num) : null), title: b || baseName(n) };
}
function coverScore(name, depthBelow) {
  const b = baseName(name).toLowerCase().replace(/[_\-.]+/g, ' ').trim();
  const front = /\bfront\b/.test(b);
  if (!front && /\b(back|rear|disc|cd|booklet|inside|inlay|tray|label|matrix|spine|obi|spek|jolly|roger|proof|header|side|sleeve|insert|logo|poster|sticker|spectr\w*|dr\d*)\b/.test(b)) return -1;
  let s = 10;
  if (/^(cover|folder|front|album|copertina)$/.test(b)) s = 100;
  else if (front) s = 80;
  else if (/cover/.test(b)) s = 70;
  return s - depthBelow * 5;
}
function albumLike(n) { return /\b(19|20)\d{2}\b/.test(n) || /\s[-–—]\s/.test(n) || /[\[\{(]/.test(n) || /\b(flac|cd|lp|sacd|hi-?res)\b/i.test(n); }

function buildLibCore(IDXFILES, AMETA, CUES) {
  const albums = new Map(), tracks = new Map(), audioByFolder = new Map(), artistFolderImg = new Map();
  const entries = Object.entries(IDXFILES).map(([lower, f]) => {
    const segs = f[0].split('/').slice(1), name = segs[segs.length - 1];
    return { lower, disp: f[0], size: f[1], rev: f[2], segs, name, ext: ext(name), folder: lower.slice(0, lower.lastIndexOf('/')) };
  });
  for (const e of entries) if (AUDIO_EXT.includes(e.ext)) { if (!audioByFolder.has(e.folder)) audioByFolder.set(e.folder, []); audioByFolder.get(e.folder).push(e); }
  const imageCue = new Map();
  for (const e of entries) if (e.ext === 'cue') {
    const aud = audioByFolder.get(e.folder) || [];
    if (aud.length !== 1) continue;
    const a = aud[0], prev = imageCue.get(a.lower);
    if (!prev || baseName(e.name).toLowerCase() === baseName(a.name).toLowerCase()) imageCue.set(a.lower, e);
  }
  for (const e of entries) {
    if (!AUDIO_EXT.includes(e.ext)) continue;
    const folders = e.segs.slice(0, -1);
    let depth;
    if (!folders.length) depth = 0;
    else if (folders.length === 1) depth = 1;
    else if (DISC_RE.test(folders[folders.length - 1])) depth = folders.length - 1;
    else if (albumLike(folders[0])) depth = 1;
    else depth = 2;
    const key = depth === 0 ? '~root' : '/' + folders.slice(0, depth).join('/').toLowerCase();
    if (!albums.has(key)) albums.set(key, { key, folder: depth ? folders[depth - 1] : '', artistFolder: depth >= 2 ? folders[depth - 2] : '', files: [], img: null, imgScore: -1, imgLen: 999 });
    e.disc = folders.slice(depth).join(' / ');
    albums.get(key).files.push(e);
  }
  for (const al of albums.values()) {
    if (al.key === '~root') { Object.assign(al, { artist: 'Varie', title: 'Brani sciolti', year: '', guessed: false }); continue; }
    const p = parseAlbumFolder(al.folder);
    if (al.artistFolder) {
      const af = al.artistFolder;
      if (p.guessed) p.title = p.title; else if (norm(p.artist) !== norm(af)) p.title = p.artist + ' - ' + p.title;
      p.artist = af; p.guessed = false;
    }
    Object.assign(al, p);
  }
  for (const al of albums.values()) if (al.guessed && !al.artist && al.files.length) {
    // nomi come «01-arctic_monkeys-star_treatment»: l'artista è nel nome del file
    const m = al.files.slice().sort((a, b) => natural(a.name, b.name))[0].name.match(/^\d{1,3}[-_. ]+([a-z0-9]+(?:_[a-z0-9]+)+)-/i);
    if (m) { const slug = m[1].replace(/_/g, ' ').toLowerCase(); if (norm(al.title).startsWith(slug + ' ')) { al.artist = al.title.slice(0, slug.length); al.title = al.title.slice(slug.length).trim(); al.guessed = false; } }
  }
  const known = [...new Set([...albums.values()].filter(a => a.artist && !a.guessed).map(a => a.artist))].sort((x, y) => y.length - x.length);
  for (const al of albums.values()) if (al.guessed && !al.artist) {
    const n = norm(al.title), hit = known.find(k => n.startsWith(norm(k) + ' '));

function rxsFifo(nch) {

    if (F.d.length && F.n + add <= F.cap) return;
    const cap = Math.max(65536, (F.n + add) * 2);

  F.push = chans => { const k = chans[0].length; F.need(k); for (let c = 0; c < nch; c++) F.d[c].set(chans[c], F.n); F.n += k; };
  F.zeros = k => { F.need(k); for (let c = 0; c < nch; c++) F.d[c].fill(0, F.n, F.n + k); F.n += k; };
  F.end = () => F.base + F.n;
  F.drop = abs => {                       // scarta tutto ciò che sta prima di «abs»
    const k = Math.max(0, Math.min(F.n, abs - F.base)); if (!k) return;
    for (let c = 0; c < nch; c++) F.d[c].copyWithin(0, k, F.n);
    F.n -= k; F.base += k;
  };
  F.take = (a, b) => F.d.map(x => x.slice(a - F.base, b - F.base));       // copia [a, b)
  return F;
}

/* ---------------- dati personali: preferiti, playlist, ascolti ----------------
   Restano sul dispositivo e, con il permesso di scrittura, nel file /_player/dati.json della cartella
   dell'app, uguale su iPhone e PC. Con lo stesso permesso il Remix copia in /_batteria/ i suoni e i ritmi
   della batteria vera e salva in /Remix/ i remix (file nuovi). Il player non scrive nient'altro su Dropbox e non tocca mai la musica. */
const DATA_PATH = '/_player/dati.json';
const HIST_MAX = 3000;
function normUD(d) {
  d = d && typeof d === 'object' ? d : {};
  return { v: 1, fav: d.fav && typeof d.fav === 'object' ? d.fav : {}, pl: d.pl && typeof d.pl === 'object' ? d.pl : {},
    hist: Array.isArray(d.hist) ? d.hist.filter(e => Array.isArray(e) && typeof e[0] === 'string' && typeof e[1] === 'number') : [],
    agg: d.agg && typeof d.agg === 'object' ? d.agg : {}, aggUpto: typeof d.aggUpto === 'number' ? d.aggUpto : 0 };
}
let UD = normUD(loadJSON(K.user));
let udDirty = !!load(K.userDirty), udTimer = null, udBusy = false, udLastSync = 0, udError = '', udBoxDraw = null;
const canWrite = () => (load(K.scopes) || '').split(/\s+/).includes(WRITE_SCOPE);
function saveUD() {
  saveJSON(K.user, UD); udDirty = true; store(K.userDirty, '1');
  if (Object.keys(OFFP.p).length) offSoon();                // playlist scaricate: brani aggiunti o tolti
  clearTimeout(udTimer); udTimer = setTimeout(syncUD, 3000);
}
function canonUD(u) { return JSON.stringify([Object.entries(u.fav).sort(), Object.entries(u.pl).sort(), u.hist, Object.entries(u.agg || {}).sort(), u.aggUpto || 0]); }
// oltre i 3000 ascolti i più vecchi diventano un riepilogo mensile (ascolti, durata, album): servono alle statistiche.
// Il riepilogo si unisce tra dispositivi prendendo il valore più alto: lo stesso ascolto non viene mai contato due volte.
function rollHist(u) {
  if (u.aggUpto) u.hist = u.hist.filter(e => e[1] > u.aggUpto);
  if (u.hist.length <= HIST_MAX) return;
  const old = u.hist.splice(0, u.hist.length - HIST_MAX);
  for (const [k, ts] of old) {
    const m = monthKey(ts), a = u.agg[m] || (u.agg[m] = { n: 0, s: 0, al: {} }), t = LIB.tracks.get(k);
    a.n++;
    if (t) { a.s += Math.round(trackInfo(t).dur || 0); a.al[t.albumKey] = (a.al[t.albumKey] || 0) + 1; }
    u.aggUpto = Math.max(u.aggUpto || 0, ts);
  }
}
function mergeAgg(a, b) {
  const out = JSON.parse(JSON.stringify(a || {}));
  for (const [m, x] of Object.entries(b || {})) {
    const o = out[m] || (out[m] = { n: 0, s: 0, al: {} });
    o.n = Math.max(o.n || 0, x.n || 0); o.s = Math.max(o.s || 0, x.s || 0); o.al = o.al || {};
    for (const [k, c] of Object.entries(x.al || {})) o.al[k] = Math.max(o.al[k] || 0, c);
  }

}
function mergeUD(a, b) {        // vince la modifica più recente, la cronologia si unisce
  const out = normUD({});
  for (const src of [a, b]) {
    for (const [k, v] of Object.entries(src.fav)) if (Array.isArray(v) && (!out.fav[k] || v[1] > out.fav[k][1])) out.fav[k] = v;
    for (const [id, p] of Object.entries(src.pl)) if (p && (!out.pl[id] || (p.t || 0) > (out.pl[id].t || 0))) out.pl[id] = p;
  }

async function fetchRemoteUD() {
  const tok = await getToken();
  const r = await fetch(CONTENT + 'files/download', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tok, 'Dropbox-API-Arg': hdrJson({ path: DATA_PATH }) } });
  if (r.status === 409) return null;                       // il file non esiste ancora
  if (r.status === 401) { accessToken = null; throw new Error('sessione da rinnovare'); }
  if (!r.ok) throw new Error('lettura non riuscita (' + r.status + ')');
  try { return normUD(JSON.parse(await r.text())); } catch (e) { throw new Error('file dei dati illeggibile'); }
}
async function uploadUD() {
  const tok = await getToken();
  const r = await fetch(CONTENT + 'files/upload', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': hdrJson({ path: DATA_PATH, mode: 'overwrite', mute: true }) }, body: JSON.stringify(UD) });
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    if (/scope/i.test(txt)) { store(K.scopes, (load(K.scopes) || '').split(/\s+/).filter(s => s !== WRITE_SCOPE).join(' ')); throw new Error('manca il permesso di scrittura'); }
    throw new Error('salvataggio non riuscito (' + r.status + ')');
  }
}
async function syncUD() {

  if (udBusy || !linked() || navigator.onLine === false) return;
  udBusy = true;
  const first = !udLastSync;
  try {
    const before = canonUD(UD);
    const remote = await fetchRemoteUD();
    if (remote) UD = mergeUD(UD, remote);
    saveJSON(K.user, UD);
    const hasData = Object.keys(UD.fav).length || Object.keys(UD.pl).length || UD.hist.length;
    const differs = remote ? canonUD(UD) !== canonUD(remote) : hasData;
    if (canWrite() && (udDirty || differs) && hasData) { await uploadUD(); udDirty = false; store(K.userDirty, null); }
    udLastSync = Date.now(); udError = '';
    if (canonUD(UD) !== before) { if (first) MIX = null; refreshUDViews(); }   // primo allineamento: il mix tiene conto anche degli ascolti sugli altri dispositivi
  } catch (e) { udError = e.message; log('Preferiti e playlist non sincronizzati: ' + e.message); }

}

let histTrack = null;
function noteListening() {
  const t = curTrack(); if (!t || audio.paused || histTrack === t.lower) return;
  const d = relDur(); if (relTime() < Math.min(30, d > 0 ? d * 0.5 : 30)) return;
  histTrack = t.lower; UD.hist.push([t.lower, Date.now()]);

function recentAlbums(n = 12) {
  const out = [], seen = new Set();
  for (let i = UD.hist.length - 1; i >= 0 && out.length < n; i--) {
    const t = LIB.tracks.get(UD.hist[i][0]); if (!t || seen.has(t.albumKey)) continue;
    const al = LIB.albums.get(t.albumKey); if (al) { seen.add(t.albumKey); out.push(al); }

/* mix: rifatto a ogni apertura della Home, simile agli ultimi ascolti */
let MIX = null;
function makeMix(size = 40) {
  const now = Date.now(), DAY = 864e5;
  const hist = UD.hist.filter(e => LIB.tracks.has(e[0]));
  let recent = hist.filter(e => now - e[1] < 14 * DAY);
  if (recent.length < 8) recent = hist.filter(e => now - e[1] < 90 * DAY);
  const last = new Map(); for (const [k, ts] of hist) last.set(k, ts);
  const arS = new Map(), alS = new Map(), add = (m, k, w) => m.set(k, (m.get(k) || 0) + w);
  for (const [k, ts] of recent) {
    const t = LIB.tracks.get(k), al = LIB.albums.get(t.albumKey); if (!al) continue;
    const w = Math.exp(-(now - ts) / (7 * DAY)); add(alS, al.key, w); add(arS, al.artistKey, w);
  }
  let basis = 'ascolti';
  if (!arS.size) {            // nessun ascolto ancora: preferiti, poi tutta la libreria
    for (const k of favList('r:')) if (LIB.artists.has(k)) add(arS, k, 1);
    for (const k of favList('a:')) { const al = LIB.albums.get(k); if (al) { add(alS, k, 1); add(arS, al.artistKey, 0.6); } }
    for (const k of favList('t:')) { const t = LIB.tracks.get(k), al = t && LIB.albums.get(t.albumKey); if (al) { add(alS, al.key, 0.4); add(arS, al.artistKey, 0.4); } }
    basis = arS.size ? 'preferiti' : 'libreria';
    if (!arS.size) for (const a of LIB.artists.values()) arS.set(a.key, 1);
  }
  if (basis === 'ascolti' && arS.size < 8) {          // pochi artisti ascoltati: completo con preferiti e, più in piccolo, il resto della libreria
    const minS = Math.min(...arS.values());
    for (const k of favList('r:')) if (LIB.artists.has(k) && !arS.has(k)) arS.set(k, minS * 0.6);
    const others = [...LIB.artists.keys()].filter(k => !arS.has(k)).sort(() => Math.random() - 0.5);
    for (const k of others) { if (arS.size >= 8) break; arS.set(k, minS * 0.15); }
  }
  const top = [...arS.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxS = top.length ? top[0][1] : 1;
  const cand = [];
  for (const [ak, s] of top) {
    const a = LIB.artists.get(ak); if (!a) continue;
    for (const alk of a.albums) {
      const al = LIB.albums.get(alk); if (!al) continue;
      for (const k of al.tracks) {
        const ls = last.get(k);
        let w = 0.3 + s / maxS;                          // quanto ascolti quell'artista di recente
        if (alS.has(alk)) w *= 1.5;                      // album ascoltato di recente
        if (isFav('t:' + k)) w *= 1.6;
        if (isFav('a:' + alk)) w *= 1.3;
        w *= RATEW[rating(k)];
        if (!ls) w *= 1.25;                              // mai sentito: da scoprire
        else if (now - ls < DAY) w *= 0.15;              // appena sentito
        cand.push({ k, al: alk, ar: ak, r: Math.pow(Math.random(), 1 / w) });
      }
    }
  }
  cand.sort((a, b) => b.r - a.r);                      // estrazione pesata senza ripetizioni
  const perAl = new Map(), pick = [];
  for (const c of cand) { if (pick.length >= size) break; const n = perAl.get(c.al) || 0; if (n >= 4) continue; perAl.set(c.al, n + 1); pick.push(c); }
  const out = [];                                       // evito due brani di fila dello stesso artista, se possibile
  while (pick.length) { const prev = out.length ? out[out.length - 1].ar : null; let i = pick.findIndex(c => c.ar !== prev); if (i < 0) i = 0; out.push(pick.splice(i, 1)[0]); }
  MIX = { items: out.map(c => c.k), basis, t: now };
  return MIX;
}

/* ---------------- mix da un artista o da un brano ----------------
   Come una «radio»: parte dal brano o dall'artista scelto e aggiunge brani affini:
   stesso artista, artisti ascoltati negli stessi momenti, stesso genere, preferiti. */
function coListened(artistKey) {          // artisti ascoltati entro 2 ore da un ascolto dell'artista scelto
  const H = UD.hist.filter(e => LIB.tracks.has(e[0])).map(([k, ts]) => [LIB.albums.get(LIB.tracks.get(k).albumKey), ts]).filter(x => x[0]);
  const seedTimes = H.filter(([al]) => al.artistKey === artistKey).map(x => x[1]);
  const m = new Map(); if (!seedTimes.length) return m;

(function playerSwipe() {
  const pl = $('player'); let x0 = 0, y0 = 0, t0 = 0, dy = 0, decided = true, drag = false;
  pl.addEventListener('touchstart', e => {
    drag = false; decided = e.touches.length !== 1 || !!e.target.closest('input, #queueBox, #eqBox, #rxBox');
    if (decided) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = performance.now(); dy = 0;
  }, { passive: true });
  pl.addEventListener('touchmove', e => {
    if (decided && !drag) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if (!decided) {
      const ddx = x - x0, ddy = y - y0;
      if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
      decided = true; drag = ddy > 0 && ddy > Math.abs(ddx) * 1.2 && pl.scrollTop <= 0;
      if (!drag) return;
      y0 = y; pl.style.transition = 'none';
    }
    e.preventDefault();
    dy = Math.max(0, y - y0); pl.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  const end = () => {
    if (!drag) return; drag = false;
    const v = dy / Math.max(1, performance.now() - t0);
    pl.style.transition = 'transform .22s ease-out';
    if (dy > 140 || (dy > 50 && v > 0.5)) {
      pl.style.transform = 'translateY(100%)';
      setTimeout(() => { closePlayer(); pl.style.transition = 'none'; pl.style.transform = ''; }, 220);
    } else pl.style.transform = '';
  };
  pl.addEventListener('touchend', end); pl.addEventListener('touchcancel', end);
})();
